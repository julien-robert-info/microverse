name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read the tested Claude Code version
        shell: bash
        run: echo "CLAUDE_CODE_VERSION=$(node -p "require('./package.json').testedWith.claudeCode")" >> "$GITHUB_ENV"
      - run: npx --yes @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }} plugin validate --strict .
      - run: npx --yes @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }} plugin test .

  # A machine with nothing of ours: empty home, a real Claude Code, no model call.
  clean-install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # bash on every system: runner.temp has backslashes on Windows.
      - name: Point the home folder at an empty one
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          {
            echo "HOME=$RUNNER_TEMP/home"
            echo "USERPROFILE=$RUNNER_TEMP/home"
            echo "APPDATA=$RUNNER_TEMP/home"
          } >> "$GITHUB_ENV"
      - name: Read the tested Claude Code version
        shell: bash
        run: echo "CLAUDE_CODE_VERSION=$(node -p "require('./package.json').testedWith.claudeCode")" >> "$GITHUB_ENV"
      - run: npm i -g @anthropic-ai/claude-code@${{ env.CLAUDE_CODE_VERSION }}
      - run: claude plugin validate --strict .
      - run: node --test tests/clean-install.test.js
        env:
          MICROVERSE_E2E: "1"
