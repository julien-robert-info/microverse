schema_version: "1.1"
name: orchestration-demarre-fr
description: The orchestration skill fires on a French "start" request.
tags: [orchestration, fr]
execution:
  prompt: "Démarre la mission « export-csv » pour le projet Zeta."
  max_turns: 4
  timeout_seconds: 120
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?orchestration"'
    arm: both
