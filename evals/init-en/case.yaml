schema_version: "1.1"
name: init-en
description: The init skill fires on an English initialisation request.
tags: [init, en]
execution:
  prompt: "Set up orchestration for this project."
  max_turns: 4
  timeout_seconds: 120
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?init"'
    arm: both
