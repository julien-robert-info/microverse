schema_version: "1.1"
name: neg-fix-typo
description: A trivial editing request fires neither plugin skill.
tags: [negative]
execution:
  prompt: "Fix the typo in this sentence: The quik brown fox jumps over the lazy dog."
  max_turns: 4
  timeout_seconds: 120
  allowed_tools: [Skill]
graders:
  - name: no-plugin-skill
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?(?:orchestration|init)"'
    min: 0
    max: 0
    arm: both
