schema_version: "1.1"
name: orchestration-mission-suivante-fr
description: The orchestration skill fires on a French "next mission" request.
tags: [orchestration, fr]
execution:
  prompt: "Mission suivante."
  max_turns: 4
  timeout_seconds: 120
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?orchestration"'
    arm: both
