schema_version: "1.1"
name: orchestration-rapport-fr
description: The orchestration skill fires on a French report request.
tags: [orchestration, fr]
execution:
  prompt: "Fais-moi le rapport de la série de chantiers."
  max_turns: 4
  timeout_seconds: 120
  allowed_tools: [Skill]
graders:
  - name: skill-fired
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?orchestration"'
    arm: both
